# One container. Evaluations live in process memory, and this size cannot scale out.
# Edge cache is off because the review stream is server-sent events.
name: hackmuse
region: fra
disable_edge_cache: true
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
services:
  - name: web
    environment_slug: node-js
    github:
      repo: ijustseen/hackmuse
      branch: main
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    http_port: 8080
    run_command: npm run start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: LLM_PROVIDER
        scope: RUN_TIME
        value: stub
      - key: SEARCH_PROVIDER
        scope: RUN_TIME
        value: stub
      - key: SPEECH_PROVIDER
        scope: RUN_TIME
        value: stub
      - key: PAGE_PROVIDER
        scope: RUN_TIME
        value: stub
