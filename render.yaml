# One always-on Node process. Evaluations live in process memory, so keep a single instance.
services:
  - type: web
    name: hackmuse
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_PROVIDER
        value: stub
      - key: SEARCH_PROVIDER
        value: stub
      - key: SPEECH_PROVIDER
        value: stub
      - key: PAGE_PROVIDER
        value: stub
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_HOST
        sync: false
      - key: ELEVENLABS_VOICE_CRITIC
        sync: false
